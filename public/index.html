<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#393536"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hanamoto Workshop</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--ink:#1c1b19;--mut:#6b675e;--card:#fff;--line:#d8d3c6;--ok:#17703a;--okbg:#e2f2e8;--acc:#b8420f;--tagbg:#fdf0d9;--tag:#8a4b00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--ink:#f1eee6;--mut:#a39f94;--card:#262522;--line:#3b3935;--ok:#5fcf8a;--okbg:#1d3326;--acc:#ff5468;--tagbg:#3d2f14;--tag:#f2c26b}}
:root[data-theme="dark"]{--bg:#1a1917;--ink:#f1eee6;--mut:#a39f94;--card:#262522;--line:#3b3935;--ok:#5fcf8a;--okbg:#1d3326;--acc:#ff5468;--tagbg:#3d2f14;--tag:#f2c26b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:900px;margin-inline:auto}
h1{font-size:24px;margin:4px 0 10px}h2{font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between}h2 b{background:var(--okbg);color:var(--ok);border-radius:999px;padding:0 12px}
.roles{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.roles button{flex:1;min-width:80px;padding:10px;font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}.roles button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}.row>div:first-child{flex:1 1 200px;display:flex;flex-direction:column}
.mut{color:var(--mut);font-size:15px}.tag{font-style:normal;font-size:14px;background:var(--tagbg);color:var(--tag);border-radius:6px;padding:1px 8px;margin-top:4px;align-self:flex-start}
.big{font:inherit;font-weight:700;font-size:19px;min-height:56px;padding:0 20px;border:0;border-radius:12px;background:var(--ok);color:#fff;flex:1 1 220px}
.alt{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--mut)}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}form .w{grid-column:1/-1}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}.chip{font:inherit;font-size:15px;border:0;border-radius:999px;background:var(--okbg);color:var(--ok);padding:6px 12px}.chips select{width:auto;padding:6px}
.ln{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
.tvg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:700px){.tvg{grid-template-columns:1fr}}
body.tv{--bg:#0f0f0e;--ink:#f5f2ea;--mut:#b5b0a3;--card:#1b1a18;--line:#3a3833;--ok:#5fcf8a;--okbg:#1d3326;background:var(--bg);color:var(--ink);max-width:none;font-size:24px}

:root{--bg:#f3f1f1;--ink:#14181f;--mut:#5d6675;--card:#fff;--line:#e0e5ee;--ok:#12a150;--okbg:#e3f6ea;--acc:#ee2236;--r0:#8a94a6;--r1:#2f6bff;--r2:#ff9f1a;--r3:#12a150;--r4:#7a4dff;--sh:0 6px 20px rgba(20,30,60,.09);--glow:#ecd9dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:#3a2a2d;--r0:#a0a8b8;--sh:0 6px 20px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--glow:#3a2a2d;--r0:#a0a8b8;--sh:0 6px 20px rgba(0,0,0,.45)}
body{background:radial-gradient(900px 360px at 0% -10%,var(--glow),transparent 70%),var(--bg)}
.hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,#2a2627 0%,#393536 60%,#ee2236 200%);color:#fff;margin-bottom:12px;box-shadow:var(--sh)}
.logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#ee2236,#b81327);display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:1px;color:#fff;flex:0 0 auto}
.hero h1{margin:0;color:#fff;font-size:22px}.hero p{margin:2px 0 0;color:#cdd7ee;font-size:14px}
.roles button{border:0;border-radius:999px;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.roles button.on{background:linear-gradient(135deg,#ee2236,#b81327);color:#fff}
.card{border:0;border-left:7px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.card.r0{border-left-color:var(--r0)}.card.r1{border-left-color:var(--r1)}.card.r2{border-left-color:var(--r2)}.card.r3{border-left-color:var(--r3)}.card.r4{border-left-color:var(--r4)}
.r0 h2::before{content:"⏳ "}.r1 h2::before{content:"🔧 "}.r2 h2::before{content:"🪚 "}.r3 h2::before{content:"🎨 "}.r4 h2::before{content:"🚚 "}
.card h2 b{background:var(--acc);color:#fff;min-width:34px;text-align:center}
.big{background:linear-gradient(135deg,#12a150,#0e8f78);box-shadow:0 6px 14px rgba(18,161,80,.35);transition:transform .08s}.big:active{transform:scale(.97)}
.alt{border-radius:12px;background:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:38px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:14px;border-radius:7px}.bar i{background:linear-gradient(90deg,#2f6bff,#12a150);border-radius:7px}
.row{border-top:1px dashed var(--line)}
input,select,textarea{border-radius:12px}
body.tv .hero{display:none}

body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10;justify-content:safe center}
.nav:empty{display:none}
.nav button{position:relative;flex:1 0 72px;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:6px 4px;border-radius:14px}
.nav button i{font-style:normal;font-size:22px;line-height:1.2}
.nav button.on{color:#fff;background:linear-gradient(135deg,#ee2236,#b81327);box-shadow:0 6px 14px rgba(238,34,54,.4)}
.nav em{position:absolute;top:0;right:8px;background:#e5173f;color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:18px;text-align:center;border-radius:9px;padding:0 5px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh);margin-bottom:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:10px;border-radius:999px;color:var(--mut)}.seg button.on{background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.tile{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:var(--sh)}
.tile b{display:block;font-size:40px;line-height:1;margin-bottom:4px}.tile span{font-size:14px;opacity:.92}
.empty{text-align:center;color:var(--mut);padding:28px 16px}
#v.fade>*{animation:up .28s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.tv .nav{display:none}body.tv{padding-bottom:12px}

button.tile{border:0;text-align:left;font:inherit;width:100%;cursor:pointer}.tile.sel{outline:4px solid var(--acc);outline-offset:2px}
.link{border:0;background:none;font:inherit;color:var(--ink);padding:4px 0;text-align:left;text-decoration:underline dotted;cursor:pointer}
.pd{margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--bg)}.pd p{margin:6px 0}
.tag.late{background:#ffe0e5;color:#b00020}
body.tv{overflow:hidden;padding:20px;height:100vh}
.tvh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.tvh h1{font-size:44px;margin:0}.tvc{font-size:24px;color:var(--mut)}
.tvg2{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:16px;height:calc(100vh - 150px)}
@media(max-width:800px){.tvg2{grid-template-columns:repeat(2,1fr)}}
.tc{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;border-left:10px solid var(--ok);box-shadow:var(--sh);overflow:hidden}
.tc.late{border-left-color:#e5173f}.tc b{font-size:32px}.tc span{font-size:20px;color:var(--mut)}.tc em{font-style:normal;font-size:24px;color:var(--acc);font-weight:700}
.tt{margin-top:auto;font-size:38px;font-weight:800}.tc.late .tt{color:#e5173f}
.dots{display:flex;justify-content:center;gap:10px;margin-top:10px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#14181f;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;max-width:90vw;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.55);display:grid;place-items:center;z-index:50;padding:20px}
.dlg{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:var(--sh)}.dlg p{margin:0 0 14px;font-size:18px}
.tile.vac{background:repeating-linear-gradient(45deg,#8a94a6,#8a94a6 12px,#7b8598 12px,#7b8598 24px)}

.prev{flex:1 1 100%;display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.prev label{display:flex;align-items:center;gap:8px;font-weight:600}.prev select{flex:1;min-width:0}
.prev small{color:var(--mut);font-size:12px}
.hero h1{letter-spacing:5px;font-weight:800;font-size:24px;line-height:1.1}.bn{display:block;color:#f1c9ce;font-size:11px;letter-spacing:2.5px;font-weight:700;margin-top:3px}#lgi{height:48px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.logo{background:#ee2236}
.lnk{border:0;background:none;font:inherit;padding:0 6px;color:inherit;cursor:pointer}
.sgrid{display:grid;grid-template-columns:minmax(0,2.4fr) 1fr .8fr .8fr .8fr .9fr;gap:6px;align-items:center;width:100%;text-align:left;font:inherit;font-size:15px;border:0;background:none;color:var(--ink);padding:10px 4px;border-top:1px dashed var(--line);cursor:pointer;border-radius:8px}
.sgrid.sh{font-size:12px;font-weight:700;color:var(--mut);border-top:0;cursor:default;text-transform:uppercase;letter-spacing:.4px;padding-bottom:4px}
.sgrid span{overflow-wrap:anywhere}.sgrid span:nth-child(n+3){text-align:right}.sgrid.low{background:color-mix(in srgb,#e5173f 14%,transparent)}

/* price history (Procurement) */
const priceHist=(l,exceptId)=>{const k=skey(l.name,l.size),h=[];pos.forEach(p=>{if(p.id===exceptId||!["ordered","pay_approval","paid","received"].includes(p.status))return;(p.lines||[]).forEach(x=>{if(skey(x.name,x.size)===k&&+x.price>0)h.push({price:+x.price,sup:p.supplier||"",at:p.orderedAt||p.created||0})})});return h.sort((a,b)=>b.at-a.at)};
const histHint=(l,exceptId)=>{const h=priceHist(l,exceptId);if(!h.length)return"No earlier price on record.";const a=h[0],m=h.reduce((x,y)=>y.price<x.price?y:x);return "Last paid "+KES(a.price)+(a.sup?" from "+a.sup:"")+" on "+fd(new Date(a.at).toLocaleDateString("en-CA"))+(m.price<a.price?" · lowest "+KES(m.price)+(m.sup?" from "+m.sup:""):"")};
const priceRows=p=>(p.lines||[]).map((l,i)=>`<div class="row" style="flex:1 1 100%;align-items:flex-start"><div style="flex:1 1 200px"><b>${lineTxt(l)}</b><span data-ph="${i}" class="mut">${histHint(l,p.id)}</span></div><input data-f="pr" data-i="${i}" type="number" min="0" placeholder="Price each (KES)" style="flex:0 0 150px"></div>`).join("");
const lineSum=p=>(p.lines||[]).reduce((a,l)=>a+(+l.price>0?l.price*(+l.qty||0):0),0);

/* express jobs */
const floorJobs=()=>jobs.filter(j=>st(j)>=PROD&&st(j)<NS&&!allReady(j));
const xAct=()=>jobs.filter(j=>j.pri==="express"&&j.exp==="approved"&&st(j)>=PROD&&st(j)<NS&&!allReady(j)).sort((a,b)=>(a.expAt||0)-(b.expAt||0));
const xCur=()=>xAct()[0]||null;
const xWait=()=>jobs.filter(j=>j.pri==="express"&&j.exp==="requested");
const pausedJob=j=>{const c=xCur();return !!c&&c.id!==j.id&&st(j)>=PROD&&st(j)<NS};
const pausedIt=it=>{const j=jobs.find(x=>x.id===it.job);return !!j&&pausedJob(j)};
const remOf=it=>it.tdue?it.tdue-Date.now():(it.tleft!=null?it.tleft:null);
const XP=f=>f.get("pri")==="express"?{pri:"express",exp:"requested",expReqAt:Date.now(),expReqBy:uid}:{pri:"queue"};
const xTags=j=>{const c=xCur(),cl=role==="client",t=[];
 if(j.pri==="express"&&j.exp==="requested"&&!cl)t.push('<i class="tag">⚡ Express requested, waiting for a director</i>');
 else if(j.pri==="express"&&j.exp==="approved"&&!allReady(j)&&st(j)>=PROD){if(c&&c.id===j.id)t.push('<i class="tag late">⚡ EXPRESS, on the floor now</i>');else if(!cl)t.push(`<i class="tag">⚡ Express, queued${c?" after "+esc(c.name):""}</i>`)}
 if(pausedJob(j))t.push(cl?'<i class="tag">⏸ Paused for a short while</i>':`<i class="tag">⏸ Paused: express job ${esc((c||{}).name||"")} is on the floor</i>`);
 return t.length?`<div class="chips">${t.join("")}</div>`:""};
const xBanner=()=>{const c=xCur();if(!c)return"";const q=xAct().slice(1),l=items.filter(i=>i.job===c.id),r=l.filter(i=>i.step>=READY).length;return `<section class="card" style="border-left-color:#e5173f"><h2>⚡ Express job on the floor</h2><b>${esc(c.name)}</b><span class="mut"> · ${esc(c.client||"")} · ${r} of ${l.length} ready</span><p class="mut" style="margin:6px 0 0">All other jobs are paused and their timers are frozen until this one is done.${q.length?" Next express: "+q.map(x=>esc(x.name)).join(", ")+".":""}</p>${role==="directors"?`<button class="alt" data-a="xe" data-id="${c.id}" style="margin-top:8px">End express early</button>`:""}</section>`};
const xCard=()=>{const l=xWait();return l.length?`<section class="card" style="border-left-color:#e5173f"><h2>Express requests<b>${l.length}</b></h2>${l.map(j=>{const n=items.filter(i=>i.job===j.id).length,sk=st(j)<PROD?JS.slice(st(j)-1,PROD-1).map(s=>s[0]):[],o=floorJobs().filter(x=>x.id!==j.id);return `<div class="row" style="align-items:flex-start"><div style="flex:1 1 100%"><b>${esc(j.name)}</b><span class="mut">${esc(j.client||"")} · ${n} item${n===1?"":"s"}${j.due?" · due "+fd(j.due):""}</span><span class="mut">${sk.length?"Goes straight to production, skipping: "+esc(sk.join(", "))+". ":""}${xCur()?"Starts after the express job now running ("+esc(xCur().name)+").":o.length?"Pauses "+o.length+" job"+(o.length===1?"":"s")+" on the floor: "+o.map(x=>esc(x.name)).join(", ")+".":"No other jobs are on the floor right now."}</span></div><button class="big" data-a="xo" data-id="${j.id}">Approve express</button><button class="alt" data-a="xn" data-id="${j.id}">Decline</button></div>`}).join("")}</section>`:""};
async function xApprove(id){const j=jobs.find(x=>x.id===id);if(!j)return;
 if(!items.some(i=>i.job===id))return toast("This job has no items yet, so there is nothing to put on the floor.");
 const skip=st(j)<PROD?JS.slice(st(j)-1,PROD-1).map(s=>s[0]):[],c0=xCur(),others=floorJobs().filter(x=>x.id!==id);
 const msg=`Approve express for "${j.name}"? `+(skip.length?`It goes straight to production and skips: ${skip.join(", ")}. `:"It is already in production. ")+(c0?`It starts after the express job now running (${c0.name}). `:others.length?`These jobs pause until it is done: ${others.map(x=>x.name).join(", ")}. `:"No other jobs are on the floor right now. ")+"Timers on paused work freeze.";
 if(!await ask(msg,"Approve express"))return;
 const u={exp:"approved",expAt:Date.now(),expBy:uid,expByName:myBy()};
 if(st(j)<PROD){u.stage=PROD;u.mid=false;u.skipped=skip;u.hist=(j.hist||[]).concat({s:st(j),by:role,u:uid,at:Date.now(),express:true})}
 await w(()=>db.doc("jobs/"+id).update(u));
 alertRoles(["jeff","walter"],`${j.name}: express approved by ${myBy()}.`+(c0?"":" Other jobs are paused until it is done."),id);
 syncHoldSoon()}
async function xDecline(id){const j=jobs.find(x=>x.id===id);if(!j)return;await w(()=>db.doc("jobs/"+id).update({exp:"declined",pri:"queue"}));alertRoles(["jeff"],`${j.name}: the express request was declined. It stays in the normal queue.`,id)}
async function xEnd(id){const j=jobs.find(x=>x.id===id);if(!j)return;if(!await ask(`End express for "${j.name}" now? Paused jobs will carry on.`,"Yes, end express"))return;await w(()=>db.doc("jobs/"+id).update({exp:"ended"}));alertRoles(["jeff","walter"],`${j.name}: express ended by a director. Paused jobs carry on.`,id);syncHoldSoon()}
/* freezing and restoring timers: safe to run from any screen, only writes when something differs */
let syncing=false,syncT=null,syncFail=0;
function syncHoldSoon(){clearTimeout(syncT);syncT=setTimeout(syncHold,1200)}
async function syncHold(){if(syncing||!db||!ready||Date.now()<syncFail)return;if(!(owner||["directors","jeff","walter","crew"].includes(role)))return;syncing=true;
 try{const now=Date.now();for(const it of items){const p=pausedIt(it);
  if(p&&it.tdue)await db.doc("items/"+it.id).update({tleft:Math.max(0,it.tdue-now),tdue:null});
  else if(!p&&it.tleft!=null&&!it.tdue)await db.doc("items/"+it.id).update({tdue:now+it.tleft,tleft:null});
  else if(!p&&it.tleft!=null)await db.doc("items/"+it.id).update({tleft:null})}}catch(e){syncFail=Date.now()+30000}
 syncing=false}

const vehCard=()=>role==="jeff"?`<section class="card"><h2>Delivery vehicles<b>${vehicles.length}</b></h2><form id="vf" style="display:block"><div class="chips"><input name="n" placeholder="Name or plate, e.g. Isuzu KDA 123X" required style="flex:2 1 200px"><button class="alt" type="submit" style="flex:0 0 auto">Add</button></div></form>${vehSort().map(x=>`<div class="row"><b>${esc(x.name)}</b><button class="alt" data-a="vdel" data-id="${x.id}">Remove</button></div>`).join("")||'<span class="mut">No vehicles yet. Add the ones you use for deliveries. For an outside hire, choose it when you add a vehicle note.</span>'}</section>`:"";
